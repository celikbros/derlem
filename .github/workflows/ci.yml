name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # go.mod'daki toolchain direktifinden okunur; güvenlik yaması için
          # yalnız go.mod bump edilir, CI otomatik takip eder (govulncheck
          # kurulu stdlib'i tarar, GOTOOLCHAIN=local'da go.mod'un toolchain
          # satırı yok sayılırdı).
          go-version-file: go.mod
          cache: true
      - run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "worker[dev]"
      - run: python -m pytest worker/tests
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=moderate
