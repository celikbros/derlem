name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: derlem
          POSTGRES_PASSWORD: derlem
          POSTGRES_DB: derlem_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U derlem -d derlem_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # go.mod'daki toolchain direktifinden okunur; güvenlik yaması için
          # yalnız go.mod bump edilir, CI otomatik takip eder (govulncheck
          # kurulu stdlib'i tarar, GOTOOLCHAIN=local'da go.mod'un toolchain
          # satırı yok sayılırdı).
          go-version-file: go.mod
          cache: true
      - name: Test backend and migrations
        env:
          DERLEM_TEST_DATABASE_URL: postgres://derlem:derlem@localhost:5432/derlem_test?sslmode=disable
        run: go test ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  worker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: derlem
          POSTGRES_PASSWORD: derlem
          POSTGRES_DB: derlem_worker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U derlem -d derlem_worker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -e "worker[dev]"
      - run: python -m pytest worker/tests
        env:
          DERLEM_TEST_DATABASE_URL: postgresql://derlem:derlem@localhost:5432/derlem_worker_test?sslmode=disable
      - name: pip-audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: npm audit
        run: npm audit --audit-level=moderate
