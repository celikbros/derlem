[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "derlem-worker"
version = "0.1.0"
description = "Derlem data processing worker"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[project.scripts]
derlem-worker = "derlem_worker.main:main"
derlem-clean-candidate = "derlem_worker.clean_candidate:main"
derlem-seed-gardas = "derlem_worker.seed_gardas:main"
derlem-source-triage = "derlem_worker.triage:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
