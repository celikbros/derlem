[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "derlem-worker"
version = "0.1.0"
description = "Derlem data processing worker"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2,<4",
    # Tam surum: belge parcalarinin (Parquet) bayt belirlenimciligi yazicinin
    # surumune baglidir (footer'daki created_by); surum degisikligi bilinclidir.
    "pyarrow==25.0.1",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "pyyaml>=6.0.3,<7",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.3,<10"]

[project.scripts]
derlem-worker = "derlem_worker.main:main"

[tool.setuptools.packages.find]
where = ["src"]

# TASK-047: hakem kilavuzu paketle gelir; SHA'si judge id'ye girer.
[tool.setuptools.package-data]
derlem_worker = ["rubrics/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
